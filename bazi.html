title: 八字排盘

<style>
/* ─────────────────────────────────────────────
   八字排盘 · 宣纸墨色
   Surface: Inspect —— 用户在研读一份命盘，
   要密度、对齐、可扫描，不要营销页的大卡片。
   ───────────────────────────────────────────── */
:root{
  --paper:#f7f4ed;
  --paper-2:#fdfcf8;
  --ink:#1c1a17;
  --ink-2:#544f47;
  --ink-3:#797367;
  --ink-4:#a39c8f;
  --rule:#ded7c8;
  --rule-soft:#eae5d9;
  --zhu:#a8352a;
  --zhu-soft:#f3e6e3;
  --qing:#3f5d52;
  --qing-soft:#e8efec;
  --f-mu:#4a7c59; --f-huo:#b04a3a; --f-tu:#9a7b3f;
  --f-jin:#6b7078; --f-shui:#3a6b8a;
  --serif:"Songti SC","STSong","STZhongsong","SimSun","Source Han Serif SC",
    "Source Han Serif CN","Noto Serif CJK SC","Noto Serif SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
    "Microsoft YaHei","Source Han Sans SC","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box}
.bz{max-width:880px;margin:0 auto;padding:0 22px 80px;background:var(--paper);
  color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
  font-size:14.5px;line-height:1.75}

/* 页头 */
.bz-head{padding:46px 0 26px;text-align:center;border-bottom:2px solid var(--ink)}
.bz-head h1{margin:0;font-family:var(--serif);font-size:28px;font-weight:600;
  letter-spacing:.44em;text-indent:.44em}
.bz-head p{margin:11px 0 0;font-size:10.5px;color:var(--ink-3);
  letter-spacing:.32em;text-indent:.32em;font-family:var(--serif)}

/* 表单 */
.bz-form{padding:26px 0 18px;border-bottom:1px solid var(--rule)}
.fgrid{display:grid;grid-template-columns:1.4fr 1fr .8fr;gap:20px}
@media(max-width:680px){.fgrid{grid-template-columns:1fr 1fr}.fgrid .w3{grid-column:span 2}}
.f label{display:block;font-size:10px;color:var(--ink-3);margin-bottom:7px;
  letter-spacing:.16em;font-weight:700}
.f input,.f select{width:100%;padding:9px 0;font-size:15px;color:var(--ink);
  border:none;border-bottom:1.5px solid var(--rule);background:transparent;
  font-family:var(--sans);transition:border-color .2s;border-radius:0}
.f input:focus,.f select:focus{outline:none;border-bottom-color:var(--ink)}
.f select{cursor:pointer;-webkit-appearance:none;appearance:none;
  background:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%) right 4px center/5px 5px no-repeat}

/* 快调条 */
.qlab{font-size:9.5px;color:var(--ink-3);letter-spacing:.2em;
  font-weight:700;margin:18px 0 7px}
.ctl{display:flex;border:1px solid var(--rule);
  border-radius:2px;overflow:hidden}
.ctl button{flex:1 1 0;padding:9px 4px;font-size:11.5px;
  background:var(--paper-2);color:var(--ink-2);border:none;
  border-right:1px solid var(--rule-soft);cursor:pointer;
  font-family:var(--sans);transition:background .15s,color .15s;
  letter-spacing:.02em;white-space:nowrap}
.ctl button:last-child{border-right:none}
.ctl button:hover{background:#f0ebe0;color:var(--ink)}
.ctl button.neg{color:var(--zhu)}
.ctl button.neg:hover{background:var(--zhu-soft)}
@media(max-width:640px){.ctl{flex-wrap:wrap}.ctl button{flex:1 1 30%;border-bottom:1px solid var(--rule-soft)}}

.hours{display:flex;margin-top:8px;border:1px solid var(--rule);
  border-radius:2px;overflow:hidden}
.hours button{flex:1 1 0;padding:8px 0;font-size:12.5px;
  background:var(--paper-2);color:var(--ink-2);border:none;
  border-right:1px solid var(--rule-soft);cursor:pointer;font-family:var(--serif);
  transition:background .15s,color .15s}
.hours button:last-child{border-right:none}
.hours button:hover{background:#f0ebe0;color:var(--ink)}
.hours button.on{background:var(--ink);color:var(--paper)}

.acts{display:flex;gap:12px;margin-top:22px;align-items:center;flex-wrap:wrap}
.btn{padding:11px 26px;font-size:13px;font-weight:600;border-radius:2px;
  cursor:pointer;border:1.5px solid var(--ink);font-family:var(--sans);
  transition:all .18s;letter-spacing:.08em}
.btn-main{background:var(--ink);color:var(--paper)}
.btn-main:hover{background:var(--zhu);border-color:var(--zhu)}
.btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--ink-4)}
.btn-ghost:hover{border-color:var(--ink);color:var(--ink)}
.tip{font-size:10.5px;color:var(--ink-3);line-height:1.8;margin-top:14px;
  letter-spacing:.02em}
.err{color:var(--zhu);font-size:12.5px;margin-top:14px;padding:9px 12px;
  background:var(--zhu-soft);border-left:2px solid var(--zhu)}
.hide{display:none!important}

/* 章节 */
.bz-sec{padding:36px 0;border-bottom:1px solid var(--rule)}
.bz-sec:last-child{border-bottom:none}
.sec-h{display:flex;align-items:baseline;gap:13px;margin-bottom:22px}
.sec-n{font-family:var(--serif);font-size:12px;color:var(--ink-4);
  letter-spacing:.12em;flex:0 0 auto}
.sec-h h2{margin:0;font-family:var(--serif);font-size:17.5px;font-weight:700;
  letter-spacing:.2em;color:var(--ink)}
.sec-h .meta{margin-left:auto;font-size:11px;color:var(--ink-3);
  letter-spacing:.06em;flex:0 0 auto;text-align:right}

/* 命盘表 */
.chart{width:100%;border-collapse:collapse;table-layout:fixed}
.chart th{font-size:10px;color:var(--ink-3);font-weight:700;
  letter-spacing:.2em;padding:0 0 12px;text-align:center}
.chart th.day{color:var(--zhu)}
.chart td{padding:0;text-align:center;vertical-align:middle}
.rowlab{font-size:10.5px;color:var(--ink-3);text-align:right;
  padding-right:13px!important;letter-spacing:.1em;font-weight:600;
  white-space:nowrap;width:78px}
.rowlab .q{display:inline-flex;align-items:center;justify-content:center;
  width:11px;height:11px;border-radius:50%;border:1px solid var(--ink-4);
  color:var(--ink-4);font-size:7.5px;margin-left:4px;cursor:help;
  font-family:var(--sans);font-weight:700;vertical-align:1px;
  transition:all .15s}
.rowlab .q:hover{background:var(--ink);border-color:var(--ink);color:var(--paper)}

.gz-row td{padding:15px 0 11px}
.gz{font-family:var(--serif);font-size:41px;font-weight:700;line-height:1;
  letter-spacing:.08em;display:block;
  font-feature-settings:"palt" 1, "kern" 1}
.gz .t{color:var(--zhu)}
.gz .d{color:var(--ink)}
.day-col{background:var(--paper-2);box-shadow:inset 2px 0 0 rgba(168,53,42,.5),
  inset -2px 0 0 rgba(168,53,42,.5)}

.dim td{padding:7px 3px;border-top:1px solid var(--rule-soft)}
.dim .v{font-size:12.5px;color:var(--ink-2);line-height:1.55}
.dim .v.sm{font-size:11px;color:var(--ink-3)}
.dim .v.dm{color:var(--zhu);font-weight:650}

.sha-cell{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;padding:8px 2px}
.sha{font-size:9.5px;padding:1.5px 4px;border-radius:2px;line-height:1.5;
  white-space:nowrap;cursor:help;background:#efece4;color:var(--ink-2);
  letter-spacing:.01em}
.sha.ji{background:var(--qing-soft);color:var(--qing)}
.sha.xiong{background:var(--zhu-soft);color:var(--zhu)}
.sha.none{background:transparent;color:var(--ink-4)}

.chart-foot{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;
  font-size:10px;color:var(--ink-3);letter-spacing:.06em}
.chart-foot .k{display:inline-flex;align-items:center;gap:5px}
.chart-foot .sw{width:8px;height:8px;border-radius:1px}

/* 文档流正文 */
.prose p{margin:0 0 14px;line-height:1.95;color:var(--ink-2);font-size:13.5px}
.prose p:last-child{margin-bottom:0}
.prose strong{color:var(--ink);font-weight:650}
.prose .lead{font-family:var(--serif);font-size:15.5px;color:var(--ink);
  line-height:1.95;letter-spacing:.03em;font-weight:600}

.kv{display:grid;margin:0 0 16px}
.kv-r{display:grid;grid-template-columns:116px 1fr;gap:16px;
  padding:8px 0;border-bottom:1px dotted var(--rule)}
.kv-r:last-child{border-bottom:none}
.kv-r .k{font-size:11px;color:var(--ink-3);letter-spacing:.08em;padding-top:2px}
.kv-r .v{font-size:13px;color:var(--ink);font-variant-numeric:tabular-nums;
  line-height:1.7}
@media(max-width:600px){.kv-r{grid-template-columns:1fr;gap:2px;padding:7px 0}}

/* 五行 */
.wx-list{display:grid}
.wx-r{display:grid;grid-template-columns:44px 118px 1fr 62px;align-items:center;
  gap:11px;padding:10px 0;border-bottom:1px solid var(--rule-soft)}
.wx-r:last-child{border-bottom:none}
.wx-n{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1}
.wx-m{font-size:10.5px;color:var(--ink-3);letter-spacing:.02em;line-height:1.5}
.wx-bar{height:3px;background:var(--rule);border-radius:2px;overflow:hidden}
.wx-fill{height:100%;border-radius:2px;transition:width .55s ease}
.wx-v{font-size:12px;color:var(--ink-2);text-align:right;
  font-variant-numeric:tabular-nums}
@media(max-width:620px){
  .wx-r{grid-template-columns:38px 1fr 54px;gap:9px}
  .wx-m{display:none}
}

/* 大运 */
.dy-track{display:flex;overflow-x:auto;border-top:1px solid var(--rule);
  border-bottom:1px solid var(--rule)}
.dy-i{flex:0 0 auto;min-width:78px;padding:13px 7px 11px;text-align:center;
  border-right:1px solid var(--rule-soft);transition:background .15s}
.dy-i:last-child{border-right:none}
.dy-i:hover{background:#f0ebe0}
.dy-i.now{background:var(--ink)}
.dy-i.now .dy-gz{color:var(--paper)}
.dy-i.now .dy-age{color:var(--ink-4)}
.dy-i.now .dy-ss{color:var(--ink-4)}
.dy-gz{font-family:var(--serif);font-size:19px;font-weight:600;
  letter-spacing:.1em;line-height:1.2;color:var(--ink)}
.dy-age{font-size:9.5px;color:var(--ink-3);margin-top:3px;
  font-variant-numeric:tabular-nums}
.dy-ss{font-size:8.5px;color:var(--ink-4);margin-top:5px;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 流年 */
.ln-track{display:flex;flex-wrap:wrap;border-top:1px solid var(--rule);
  border-left:1px solid var(--rule)}
.ln-i{flex:0 0 auto;width:60px;padding:9px 2px;text-align:center;
  border-right:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);
  cursor:pointer;transition:background .13s;background:var(--paper-2)}
.ln-i:hover{background:#f0ebe0}
.ln-i.on{background:var(--ink)}
.ln-i.on .ln-gz{color:var(--paper)}
.ln-i.on .ln-y{color:var(--ink-4)}
.ln-y{display:block;font-size:9px;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.ln-gz{display:block;font-family:var(--serif);font-size:13.5px;
  font-weight:600;letter-spacing:.05em;margin-top:1px;color:var(--ink)}

.ln-panel{border:1px solid var(--rule);border-top:none;
  background:var(--paper-2);padding:20px 22px}
.ln-head{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap;
  padding-bottom:13px;margin-bottom:14px;border-bottom:1px solid var(--rule-soft)}
.ln-year{font-family:var(--serif);font-size:25px;font-weight:600;
  letter-spacing:.04em;line-height:1}
.ln-tag{font-size:10.5px;padding:2px 8px;border-radius:2px;
  background:#efece4;color:var(--ink-2);letter-spacing:.06em;font-weight:700}
.ln-tag.god{background:var(--ink);color:var(--paper)}
.ln-body{font-size:13px;line-height:1.95;color:var(--ink-2)}
.ln-body .em{color:var(--ink);font-weight:650}
.rel-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.rel-chip{font-size:11px;padding:2px 8px;border:1px solid var(--rule);
  border-radius:2px;color:var(--ink-2);background:var(--paper)}
.rel-chip.chong{border-color:var(--zhu);color:var(--zhu)}
.rel-chip.he{border-color:var(--qing);color:var(--qing)}
.ln-caveat{margin-top:14px;padding-top:12px;border-top:1px dotted var(--rule);
  font-size:10.5px;color:var(--ink-3);line-height:1.85}

/* 附录 */
.appx{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  border-top:1px solid var(--rule-soft)}
.appx-i{padding:13px 14px 13px 0;border-bottom:1px solid var(--rule-soft)}
.appx-i .k{font-size:10px;color:var(--ink-3);letter-spacing:.12em;margin-bottom:3px}
.appx-i .v{font-family:var(--serif);font-size:14.5px;font-weight:600;color:var(--ink)}

@media(max-width:600px){
  .bz{padding:0 16px 60px}
  .bz-head{padding:32px 0 20px}
  .bz-head h1{font-size:22px;letter-spacing:.32em;text-indent:.32em}
  .gz{font-size:30px}
  .rowlab{width:58px;font-size:9.5px;padding-right:8px!important}
  .rowlab .q{display:none}
  .dim .v{font-size:11.5px}
  .dim .v.sm{font-size:10px}
  .dy-i{min-width:68px;padding:11px 5px 9px}
  .dy-gz{font-size:17px}
  .ln-i{width:54px}
  .bz-sec{padding:26px 0}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
(function () {
  'use strict';

  var WXC = { '木':'#4a7c59', '火':'#b04a3a', '土':'#9a7b3f', '金':'#6b7078', '水':'#3a6b8a' };
  var $ = function (id) { return document.getElementById(id); };
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function mk(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  var HOURS = [['子',0],['丑',2],['寅',4],['卯',6],['辰',8],['巳',10],
               ['午',12],['未',14],['申',16],['酉',18],['戌',20],['亥',22]];
  HOURS.forEach(function (h) {
    var b = mk('button', '', h[0]);
    b.setAttribute('data-h', h[1]);
    $('ctlHours').appendChild(b);
  });

  function dateShift(days) {
    var v = $('bzDate').value;
    if (!v) return;
    var p = v.split('-');
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]));
    d.setUTCDate(d.getUTCDate() + days);
    $('bzDate').value = d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate());
    run();
  }

  $('ctlDate').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    if (b.id === 'ctlToday') {
      var n = new Date(Date.now() + 8 * 3600 * 1000);
      $('bzDate').value = n.getUTCFullYear() + '-' + pad(n.getUTCMonth() + 1) + '-' + pad(n.getUTCDate());
      $('bzTime').value = pad(n.getUTCHours()) + ':' + pad(n.getUTCMinutes());
      run();
      return;
    }
    var d = b.getAttribute('data-d');
    if (d) dateShift(parseInt(d, 10));
  });

  $('ctlHours').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    $('bzTime').value = pad(parseInt(b.getAttribute('data-h'), 10)) + ':00';
    $('ctlHours').querySelectorAll('button').forEach(function (x) { x.classList.remove('on'); });
    b.classList.add('on');
    run();
  });

  $('bzGo').addEventListener('click', run);
  ['bzDate', 'bzTime', 'bzSex'].forEach(function (id) {
    $(id).addEventListener('change', run);
  });

  function err(m) { var e = $('bzErr'); e.textContent = m; e.classList.remove('hide'); }
  function noerr() { $('bzErr').classList.add('hide'); }

  var TIPS = {
    '十神': '其他天干与日主的关系：比劫=同类，食伤=我所生（才华），财=我所克（收入），官杀=克我（责任压力），印=生我（庇护学习）',
    '藏干': '地支暗含的天干，决定这个地支真正起什么作用',
    '藏干十神': '把藏干换算成十神，看地支在做什么事',
    '纳音': '六十甲子配五行的古法，多作辅助参考',
    '星运': '十二长生：日主在此地支的生命力状态，长生最强、绝最弱',
    '自坐': '本柱天干坐自己地支的状态，看这柱有没有底气',
    '空亡': '此柱落在六十甲子的空位，力量会打折',
    '神煞': '古人对特定干支组合的标签，朱色为凶煞、青色为吉神'
  };

  function renderChart(c) {
    var t = $('tChart');
    t.innerHTML = '';

    var head = mk('tr');
    head.appendChild(mk('td', 'rowlab'));
    ['年柱', '月柱', '日柱', '时柱'].forEach(function (n, i) {
      var th = document.createElement('th');
      th.textContent = n;
      if (i === 2) th.className = 'day';
      head.appendChild(th);
    });
    t.appendChild(head);

    var gzRow = mk('tr', 'gz-row');
    gzRow.appendChild(mk('td', 'rowlab', '干支'));
    c.pillarList.forEach(function (gz, i) {
      var cell = mk('td', i === 2 ? 'day-col' : '');
      var span = mk('span', 'gz');
      span.appendChild(mk('span', 't', gz[0]));
      span.appendChild(mk('span', 'd', gz[1]));
      cell.appendChild(span);
      gzRow.appendChild(cell);
    });
    t.appendChild(gzRow);

    var ROWS = [
      ['十神', c.tenGods, function (v, i) { return [i === 2 ? 'v dm' : 'v', v]; }],
      ['藏干', c.canggan.map(function (a) { return a.join(' '); }), function (v) { return ['v', v]; }],
      ['藏干十神', c.cangganGods.map(function (a) { return a.join(' '); }), function (v) { return ['v sm', v]; }],
      ['纳音', c.nayin, function (v) { return ['v sm', v]; }],
      ['星运', c.xingyun, function (v) { return ['v sm', v]; }],
      ['自坐', c.zizuo, function (v) { return ['v sm', v]; }],
      ['空亡', c.kongwang, function (v) { return ['v sm', v]; }]
    ];

    ROWS.forEach(function (row) {
      var r = mk('tr', 'dim');
      var lab = mk('td', 'rowlab', row[0]);
      if (TIPS[row[0]]) {
        var q = mk('span', 'q', '?');
        q.title = TIPS[row[0]];
        lab.appendChild(q);
      }
      r.appendChild(lab);
      for (var i = 0; i < 4; i++) {
        var cell = mk('td', i === 2 ? 'day-col' : '');
        var spec = row[2](row[1][i], i);
        cell.appendChild(mk('div', spec[0], spec[1]));
        r.appendChild(cell);
      }
      t.appendChild(r);
    });

    var sr = mk('tr', 'dim');
    var slab = mk('td', 'rowlab', '神煞');
    var sq = mk('span', 'q', '?');
    sq.title = TIPS['神煞'];
    slab.appendChild(sq);
    sr.appendChild(slab);
    for (var i = 0; i < 4; i++) {
      var cell = mk('td', i === 2 ? 'day-col' : '');
      var wrap = mk('div', 'sha-cell');
      var arr = c.shensha[i];
      if (!arr.length) {
        wrap.appendChild(mk('span', 'sha none', '—'));
      } else {
        arr.forEach(function (s) {
          var info = BZ_SHENSHA_INFO[s];
          var cls = 'sha';
          if (info) {
            if (info.lvl === '凶') cls += ' xiong';
            else if (info.lvl === '吉' || info.lvl === '大吉') cls += ' ji';
          }
          var e = mk('span', cls, s);
          if (info) e.title = s + '（' + info.lvl + '）：' + info.desc;
          wrap.appendChild(e);
        });
      }
      cell.appendChild(wrap);
      sr.appendChild(cell);
    }
    t.appendChild(sr);
  }

  function renderCore(c) {
    var sec = bzAnalyze(c)[0];
    $('mCore').textContent = c.dayMaster + ' · ' + c.dayMasterWuxing;

    var kv = $('kvCore');
    kv.innerHTML = '';
    sec.items.forEach(function (it) {
      var r = mk('div', 'kv-r');
      r.appendChild(mk('div', 'k', it.k));
      r.appendChild(mk('div', 'v', it.v));
      kv.appendChild(r);
    });

    var p = $('pCore');
    p.innerHTML = '';
    var parts = sec.text.split('　');
    p.appendChild(mk('p', 'lead', parts[0]));
    if (parts.length > 1) p.appendChild(mk('p', '', parts.slice(1).join('　')));
  }

  function renderWx(c) {
    var keys = ['木', '火', '土', '金', '水'];
    var MEAN = { '木':'仁爱·成长', '火':'热情·表达', '土':'信用·稳定',
                 '金':'果断·条理', '水':'智慧·应变' };
    var mx = 0, tot = 0;
    keys.forEach(function (k) {
      if (c.wuxingScore[k] > mx) mx = c.wuxingScore[k];
      tot += c.wuxingCount[k];
    });
    $('mWx').textContent = '共 ' + tot + ' 字';

    var box = $('pWx');
    box.innerHTML = '';
    keys.forEach(function (k) {
      var r = mk('div', 'wx-r');
      var n = mk('div', 'wx-n', k);
      n.style.color = WXC[k];
      r.appendChild(n);
      r.appendChild(mk('div', 'wx-m', MEAN[k] + ' · ' + c.wuxingCount[k] + '字'));
      var bar = mk('div', 'wx-bar');
      var fill = mk('div', 'wx-fill');
      fill.style.background = WXC[k];
      fill.style.width = (mx > 0 ? (c.wuxingScore[k] / mx) * 100 : 0) + '%';
      bar.appendChild(fill);
      r.appendChild(bar);
      r.appendChild(mk('div', 'wx-v', Number(c.wuxingScore[k]).toFixed(1)));
      box.appendChild(r);
    });

    var pt = $('pWxText');
    pt.innerHTML = '';
    pt.appendChild(mk('p', '', bzAnalyze(c)[1].text));
  }

  function fillKv(id, items) {
    var kv = $(id);
    kv.innerHTML = '';
    items.forEach(function (it) {
      var r = mk('div', 'kv-r');
      r.appendChild(mk('div', 'k', it.k));
      r.appendChild(mk('div', 'v', it.v));
      kv.appendChild(r);
    });
  }

  function renderGod(c) {
    var sec = bzAnalyze(c)[2];
    fillKv('kvGod', sec.items);
    var p = $('pGod');
    p.innerHTML = '';
    p.appendChild(mk('p', '', sec.text));
  }

  function renderSha(c) {
    var sec = bzAnalyze(c)[4];
    $('mSha').textContent = sec.items.length + ' 项';
    fillKv('kvSha', sec.items);
    var p = $('pSha');
    p.innerHTML = '';
    p.appendChild(mk('p', '', sec.text));
  }

  function ageNow(c) {
    if (!c) return null;
    var b = new Date(c.ms + 8 * 3600000);
    var n = new Date(Date.now() + 8 * 3600000);
    return n.getUTCFullYear() - b.getUTCFullYear() + 1;
  }

  function renderDy(c) {
    var q = c.qiyun;
    $('mDy').textContent = q.age + ' 岁起运 · ' + (q.forward ? '顺行' : '逆行');

    var t = $('tDy');
    t.innerHTML = '';
    var now = ageNow(c);
    c.dayun.forEach(function (gz, i) {
      var lo = q.age + i * 10;
      var d = mk('div', 'dy-i');
      if (now !== null && now >= lo && now < lo + 10) d.classList.add('now');
      d.appendChild(mk('div', 'dy-gz', gz));
      d.appendChild(mk('div', 'dy-age', lo + '–' + (lo + 10)));
      var ss = (c.dyshensha[i] || [null, []])[1];
      if (ss && ss.length) d.appendChild(mk('div', 'dy-ss', ss.slice(0, 2).join('·')));
      t.appendChild(d);
    });

    var p = $('pDy');
    p.innerHTML = '';
    p.appendChild(mk('p', '',
      '交运：' + (q.jiaoyunText || '') + '。' + bzAnalyze(c)[5].text));
  }

  function renderLn(c) {
    var t = $('tLn');
    t.innerHTML = '';
    var nowY = new Date().getFullYear();
    for (var y = nowY - 2; y < nowY + 20; y++) {
      var d = mk('div', 'ln-i');
      d.setAttribute('data-y', y);
      d.appendChild(mk('span', 'ln-y', y));
      d.appendChild(mk('span', 'ln-gz', JIAZI[((y - 1984) % 60 + 60) % 60]));
      if (y === nowY) d.classList.add('on');
      t.appendChild(d);
    }
    t.onclick = function (e) {
      var d = e.target.closest('.ln-i');
      if (!d) return;
      t.querySelectorAll('.ln-i').forEach(function (x) { x.classList.remove('on'); });
      d.classList.add('on');
      showLn(c, parseInt(d.getAttribute('data-y'), 10));
    };
    showLn(c, nowY);
  }

  function showLn(c, year) {
    var d = bzLiunianDetail(c, year);
    var box = $('pLn');
    box.innerHTML = '';

    var head = mk('div', 'ln-head');
    head.appendChild(mk('div', 'ln-year', year));
    head.appendChild(mk('span', 'ln-tag', d.gz));
    head.appendChild(mk('span', 'ln-tag', d.age + ' 岁'));
    head.appendChild(mk('span', 'ln-tag god', d.god + '年'));
    box.appendChild(head);

    var body = mk('div', 'ln-body');
    body.appendChild(mk('p', '', d.summary));

    if (d.relations.length) {
      var chips = mk('div', 'rel-chips');
      d.relations.forEach(function (r) {
        chips.appendChild(mk('span', 'rel-chip' + (r.indexOf('冲') > 0 ? ' chong' : ' he'), r));
      });
      body.appendChild(chips);
    }

    var p2 = mk('p');
    p2.innerHTML = '<span class="em">' + d.god + '运 · ' + (d.godTopic || '') +
      '</span>　' + d.advice;
    body.appendChild(p2);
    box.appendChild(body);

    box.appendChild(mk('div', 'ln-caveat',
      '流年看的是这一年的主要议题，吉凶仍须结合大运与已积累的处境。把压力当信息读，比当判决读有用。'));
  }

  function renderAppx(c) {
    var box = $('pAppx');
    box.innerHTML = '';
    [
      ['胎元', c.taiyuan + '（' + c.taiyuanNayin + '）'],
      ['胎息', c.taixi + '（' + c.taixiNayin + '）'],
      ['命宫', c.minggong + '（' + c.minggongNayin + '）'],
      ['身宫', c.shengong + '（' + c.shengongNayin + '）'],
      ['起运', c.qiyun.age + '岁' + c.qiyun.months + '月' + c.qiyun.days + '天'],
      ['今日干支', c.tdbz.join(' ')]
    ].forEach(function (it) {
      var d = mk('div', 'appx-i');
      d.appendChild(mk('div', 'k', it[0]));
      d.appendChild(mk('div', 'v', it[1]));
      box.appendChild(d);
    });
  }

  function render(c, label) {
    renderChart(c);
    renderCore(c);
    renderWx(c);
    renderGod(c);
    renderSha(c);
    renderDy(c);
    renderLn(c);
    renderAppx(c);
    $('mBirth').textContent = label + ' · ' + (c.sex === 1 ? '男' : '女');
    $('bzView').classList.remove('hide');
  }

  function run() {
    noerr();
    var dv = $('bzDate').value;
    var tv = $('bzTime').value || '12:00';
    var sex = parseInt($('bzSex').value, 10);
    if (!dv) { err('请选择出生日期'); return; }

    var ym = dv.split('-'), tm = tv.split(':');
    var y = +ym[0], mo = +ym[1], d = +ym[2], hh = +tm[0], mi = +tm[1];
    if (y < 1900 || y > 2100) { err('仅支持 1900–2100 年'); return; }

    try {
      // 第 4 参数传「今天」的 00:00，用于胎对八字（tdbz）
      var today = new Date();
      var todayMs = cstMs(today.getFullYear(), today.getMonth() + 1,
                          today.getDate(), 0, 0, 0);
      var chart = paipan(cstMs(y, mo, d, hh, mi, 0), sex, true, todayMs);
      window.__bz = chart;
      render(chart, dv + ' ' + tv);
    } catch (e) {
      err('排盘失败：' + e.message);
      if (window.console) console.error(e);
    }
  }

  $('bzCopy').addEventListener('click', function () {
    if (!window.__bz) { err('请先排盘'); return; }
    var c = window.__bz;
    var out = '【四柱】' + c.pillarList.join(' ') + '\n'
      + '【日主】' + c.dayMaster + '（' + c.dayMasterWuxing + '）\n'
      + '【十神】' + c.tenGods.join(' ') + '\n'
      + '【大运】' + c.dayun.slice(0, 8).join(' ') + '\n'
      + '【起运】' + c.qiyun.age + '岁' + c.qiyun.months + '月' + c.qiyun.days + '天　'
      + (c.qiyun.jiaoyunText || '') + '\n\n';
    bzAnalyze(c).forEach(function (s, i) {
      out += ['壹','贰','叁','肆','伍','陆'][i] + ' ' + s.title + '\n';
      s.items.forEach(function (it) { out += '  ' + it.k + '：' + it.v + '\n'; });
      if (s.text) out += '  ' + s.text + '\n';
      out += '\n';
    });
    navigator.clipboard.writeText(out).then(function () {
      var b = $('bzCopy'), old = b.textContent;
      b.textContent = '已复制';
      setTimeout(function () { b.textContent = old; }, 1400);
    }).catch(function () { err('复制失败，请手动选择'); });
  });

  run();
})();
</script>
